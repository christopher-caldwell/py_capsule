name: Package release

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"
  TWINE_VERSION: "7.0.0"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out release revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Sync test environment
        run: uv sync --frozen --group dev --python "${{ matrix.python-version }}"

      - name: Check formatting, lint, and types
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check

      - name: Check lockfiles
        run: |
          uv lock --check
          uv lock --check --project examples/wrapper
          uv lock --check --project examples/fixture-project

      - name: Run tests
        run: uv run --frozen --python "${{ matrix.python-version }}" python -m pytest

      - name: Run acceptance capsules
        run: uv run --frozen --project examples/wrapper python examples/run_canonical_examples.py

      - name: Check whitespace errors
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
            git diff --check "$base" HEAD
          else
            git diff --check
          fi

  build:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out release revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build validation tools
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}" "twine==${TWINE_VERSION}"

      - name: Verify release gate
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -m scripts.release_gate "$RELEASE_TAG"

      - name: Report PyPI project state
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          import json
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{name}/json"

          try:
              with urlopen(url, timeout=20) as response:
                  payload = json.load(response)
          except HTTPError as exc:
              if exc.code == 404:
                  print(f"{name!r} is not currently registered on PyPI")
              else:
                  raise
          else:
              releases = payload.get("releases", {})
              if version in releases and releases[version]:
                  raise SystemExit(
                      f"PyPI already contains files for {name} {version}; "
                      "refusing to build a duplicate release candidate"
                  )
              print(
                  f"PyPI already has a project named {name!r}; "
                  "confirm ownership before first publication"
              )
          PY

      - name: Build wheel and source distribution
        run: |
          rm -rf build dist
          uv build --no-sources

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Inspect distribution contents
        run: python -m scripts.validate_artifacts inspect dist

      - name: Store exact distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  artifact-test:
    name: Test installed wheel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out release revision for acceptance fixtures
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Retrieve exact distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl

      - name: Verify installed public API and real capsule execution
        env:
          PYTHONPATH: ""
          PYCAPSULE_ACCEPTANCE_HOME: ${{ runner.temp }}/pycapsule-home
        run: |
          cd "$RUNNER_TEMP"
          HOME="$PYCAPSULE_ACCEPTANCE_HOME" "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/validate_artifacts.py" installed "$GITHUB_WORKSPACE"

          HOME="$PYCAPSULE_ACCEPTANCE_HOME" PYTHONPATH="" \
            "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/examples/run_canonical_examples.py"

      - name: Rebuild from sdist and compare library sources
        run: |
          mkdir -p "$RUNNER_TEMP/from-sdist"
          python -m pip wheel --disable-pip-version-check --no-deps --no-cache-dir \
            --wheel-dir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz

          python -m scripts.validate_artifacts compare \
            dist/*.whl "$RUNNER_TEMP/from-sdist/"*.whl

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: artifact-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capsule-runner
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish exact distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
